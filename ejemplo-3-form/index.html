<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Formulario de Contacto</h1>

      <form id="contactForm">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre completo"
            required
          />
          <span class="error-msg" id="errorNombre"></span>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            required
          />
          <span class="error-msg" id="errorEmail"></span>
        </div>

        <div class="form-group">
          <label for="edad">Edad:</label>
          <input
            type="number"
            id="edad"
            name="edad"
            min="18"
            max="120"
            placeholder="18"
            required
          />
          <span class="error-msg" id="errorEdad"></span>
        </div>

        <div class="form-group">
          <label for="pais">País:</label>
          <select id="pais" name="pais" required>
            <option value="">-- Selecciona un país --</option>
            <option value="Mexico">México</option>
            <option value="Colombia">Colombia</option>
            <option value="Argentina">Argentina</option>
            <option value="Chile">Chile</option>
            <option value="Peru">Perú</option>
            <option value="Venezuela">Venezuela</option>
            <option value="Otro">Otro</option>
          </select>
          <span class="error-msg" id="errorPais"></span>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje:</label>
          <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            placeholder="Escribe tu mensaje aquí..."
            required
          ></textarea>
          <span class="error-msg" id="errorMensaje"></span>
        </div>

        <div class="form-group">
          <label for="suscribir">
            <input type="checkbox" id="suscribir" name="suscribir" />
            Suscribirse a noticias
          </label>
        </div>

        <button type="submit" class="btn-submit">Enviar</button>
        <button type="reset" class="btn-reset">Limpiar</button>
      </form>

      <div id="resultado" class="resultado" style="display: none">
        <h2>¡Datos recibidos!</h2>
        <div id="resultadoContenido"></div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
