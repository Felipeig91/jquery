<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Simple</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        background-color: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      #mensaje {
        margin-top: 20px;
        padding: 15px;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        display: none;
        animation: slideIn 0.3s ease;
      }

      #mensaje.error {
        background-color: #ffebee;
        color: #c62828;
        border-left: 4px solid #c62828;
      }

      #mensaje.exito {
        background-color: #e8f5e9;
        color: #2e7d32;
        border-left: 4px solid #2e7d32;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Formulario Simple</h1>

      <form id="miFormulario">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingresa tu nombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="correo">Correo:</label>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="tu@email.com"
            required
          />
        </div>

        <button type="submit">Enviar</button>
      </form>

      <div id="mensaje"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        // Manejar el envío del formulario
        $("#miFormulario").on("submit", function (e) {
          // Prevenir el envío por defecto del formulario
          e.preventDefault();

          // Obtener los valores de los campos
          const nombre = $("#nombre").val().trim();
          const correo = $("#correo").val().trim();

          // Variable para saber si es válido
          let esValido = true;

          // Validar que el nombre no esté vacío
          if (nombre === "") {
            esValido = false;
          }

          // Validar que el nombre tenga al menos 3 caracteres
          if (nombre.length < 3) {
            esValido = false;
          }

          // Validar que el correo no esté vacío
          if (correo === "") {
            esValido = false;
          }

          // Validar formato de correo con expresión regular
          const patronEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!patronEmail.test(correo)) {
            esValido = false;
          }

          // Mostrar mensaje según si es válido o no
          if (esValido) {
            // Si es válido, mostrar mensaje de éxito
            $("#mensaje")
              .removeClass("error")
              .addClass("exito")
              .text("✓ Datos válidos, formulario enviado correctamente")
              .show();

            // Limpiar el formulario después de 2 segundos
            setTimeout(function () {
              $("#miFormulario")[0].reset();
              $("#mensaje").fadeOut();
            }, 2000);
          } else {
            // Si no es válido, mostrar mensaje de error
            $("#mensaje")
              .removeClass("exito")
              .addClass("error")
              .text("✗ Datos incorrectos, verifica los campos")
              .show();
          }
        });
      });
    </script>
  </body>
</html>
